<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGDPS - Oficial</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        .video-fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .capa-oscura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .contenedor {
            position: relative;
            z-index: 1;
            padding: 5vh 20px 10vh 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3.5em;
            color: #dbe1ff; 
            text-shadow: 0 0 15px #b5ead7, 0 0 30px #a8e6cf;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .boton {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 15px auto;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #333333;
            text-decoration: none;
            border: 2px solid white;
            border-radius: 12px;
            transition: 0.3s;
        }

        .botones-dobles {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .botones-dobles .boton {
            margin: 0;
            flex: 1;
            font-size: 1.1em;
            padding: 15px 5px;
        }

        .video-promo {
            margin: 30px 0;
            border: 2px solid #ffdac1;
            border-radius: 12px;
            overflow: hidden;
            background: black;
        }

        .video-promo iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
        }

        .btn-apk { background: linear-gradient(45deg, #ffdac1, #ffcbb3); }
        .btn-descarga { background: linear-gradient(45deg, #b5ead7, #a2d9c5); }
        .btn-demon { background: linear-gradient(45deg, #ffb7b2, #ffa39e); }
        .btn-youtube { background: linear-gradient(45deg, #ff9aa2, #ff858e); }
        .btn-tiktok { background: linear-gradient(45deg, #8a79af, #6e5c94); color: #ffffff; }
        .btn-discord { background: linear-gradient(45deg, #c7ceea, #b2badd); margin-top: 30px; }

        .boton:active {
            transform: scale(0.95);
        }

        .cajas-dobles-madera {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .caja-madera {
            flex: 1;
            background: linear-gradient(135deg, #e4c5a1, #cda37b);
            border: 2px solid #f7e6d2;
            border-radius: 12px;
            padding: 14px 8px;
            color: #3b2512;
            box-sizing: border-box;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .caja-madera h3 {
            margin: 0 0 6px 0;
            font-size: 1.05em;
            text-transform: uppercase;
            color: #2c1808;
            border-bottom: 1px solid rgba(60, 35, 15, 0.2);
            padding-bottom: 4px;
        }

        .caja-madera p {
            margin: 4px 0;
            font-size: 0.88em;
            font-weight: bold;
        }

        .indicador-online {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #23a55a;
            border-radius: 50%;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <video class="video-fondo" autoplay loop muted playsinline>
        <source src="loop_fondo.mp4" type="video/mp4">
    </video>
    <div class="capa-oscura"></div>

    <div class="contenedor">
        <h1>¡BIENVENIDO A ZEN GDPS!</h1>
        
        <div class="botones-dobles">
            <a href="https://drive.google.com/file/d/1b5sf470Oqf5zZApgI4e66TtAtaK2iZo7/view?usp=drivesdk" class="boton btn-apk">Descarga Android 📱 </a>
            <a href="https://drive.google.com/file/d/1Zu8uzaqZyzGCsLdLZyQFpvtl3viwNosb/view?usp=drivesdk" class="boton btn-descarga">Descarga PC 💻 </a>
        </div>

        <div class="video-promo">
            <iframe src="https://www.youtube.com/embed/d4mLZEDXgVA" allowfullscreen></iframe>
        </div>

        <div class="cajas-dobles-madera">
            <div class="caja-madera">
                <h3>Discord </h3>
                <p><span class="indicador-online"></span><span id="discord-online">Cargando...</span></p>
                <p>👥 <span id="discord-total">14 Miembros</span></p>
            </div>

            <div class="caja-madera">
                <h3>Destacado </h3>
                <p>🎮 <span id="nivel-nombre">Level Name</span></p>
                <p><span id="nivel-creador">👤 Por: Creador</span></p>
            </div>
        </div>

        <a href="https://sites.google.com/view/zgdps-demon-list/demon-list?authuser=0" class="boton btn-demon">Demon List</a>

        <div class="botones-dobles">
            <a href="https://youtube.com/@senkogdps?si=U9_o5dM0em22q4b0" class="boton btn-youtube" target="_blank">YouTube </a>
            <a href="https://www.tiktok.com/@imsenkogd" class="boton btn-tiktok" target="_blank">TikTok </a>
        </div>
        
        <a href="https://discord.gg/F4GMNuwmb" class="boton btn-discord" target="_blank"> DISCORD ZEN </a>
    </div>

    <script src="destacado.js"></script>

    <script>
        const DISCORD_GUILD_ID = "1542250869028814878";

        async function obtenerDiscordLive() {
            try {
                const res = await fetch(`https://discord.com/api/guilds/${DISCORD_GUILD_ID}/widget.json`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("discord-online").textContent = `${data.presence_count} En Línea`;
                } else {
                    document.getElementById("discord-online").textContent = "10 En Línea";
                }
            } catch (e) {
                document.getElementById("discord-online").textContent = "10 En Línea";
            }
        }

        function obtenerNivelLive() {

                document.getElementById("nivel-nombre").textContent = nivelSemanal.nombre;
                document.getElementById("nivel-creador").textContent = `👤 Por: ${nivelSemanal.creador}`;
            }
        }

        obtenerDiscordLive();
        obtenerNivelLive();
    </script>
</body>
</html>
