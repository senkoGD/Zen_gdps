<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen GDPS - Oficial</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        .video-fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .capa-oscura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .contenedor {
            position: relative;
            z-index: 1;
            padding: 5vh 20px 10vh 20px;
            max-width: 600px;
            margin: 0 auto;
        }


        .header-container {
            text-align: center;
            margin: 10px auto 30px auto;
        }

        .logo-img {
            max-width: 95%;
            height: auto;
            filter: drop-shadow(0px 5px 15px rgba(0,0,0,0.8));
        }

        .gd-downloads-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 20px auto;
            width: 100%;
        }

        .gd-downloads-container a {
            display: inline-block;
            width: 46%; 
            max-width: 200px;
        }

        .gd-btn-large {
            width: 100%; 
            height: auto;
            transition: transform 0.1s ease;
            cursor: pointer;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        .gd-buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            max-width: 380px;
        }

        .gd-btn {
            width: 85px;
            height: auto;
            transition: transform 0.1s ease;
            cursor: pointer;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        .gd-btn:active, 
        .gd-btn-large:active {
            transform: scale(0.90);
        }
        
        .video-promo {
            margin: 30px 0;
            border: 2px solid #ffdac1;
            border-radius: 12px;
            overflow: hidden;
            background: black;
        }

        .video-promo iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
        }

        .cajas-dobles-madera {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .caja-madera {
            flex: 1;
            background: rgba(0, 0, 0, 0.45); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 14px 8px;
            color: #ffffff;
            box-sizing: border-box;
            user-select: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .caja-madera h3 {
            margin: 0 0 6px 0;
            font-size: 1.05em;
            text-transform: uppercase;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .caja-madera p {
            margin: 4px 0;
            font-size: 0.88em;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .indicador-online {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #23a55a;
            border-radius: 50%;
            margin-right: 4px;
            box-shadow: 0 0 6px #23a55a;
        }
    </style>
</head>
<body>
    
    <video class="video-fondo" autoplay loop muted playsinline>
        <source src="loop_fondo.mp4" type="video/mp4">
    </video>
    <div class="capa-oscura"></div>

    <div class="contenedor">
        
        <div class="header-container">
            <img src="head_page.png" alt="Zen GDPS Logo" class="logo-img">
        </div>
        
        <div class="gd-downloads-container">
            <a href="https://drive.google.com/file/d/1b5sf470Oqf5zZApgI4e66TtAtaK2iZo7/view?usp=drivesdk" target="_blank">
                <img src="descarga_apk.png" alt="Descarga Android" class="gd-btn-large">
            </a>
            <a href="https://drive.google.com/file/d/1Zu8uzaqZyzGCsLdLZyQFpvtl3viwNosb/view?usp=drivesdk" target="_blank">
                <img src="descarga_pc.png" alt="Descarga PC" class="gd-btn-large">
            </a>
        </div>

        <div class="video-promo">
            <iframe src="https://www.youtube.com/embed/d4mLZEDXgVA" allowfullscreen></iframe>
        </div>

        <div class="gd-buttons-container">
            <a href="https://sites.google.com/view/zgdps-demon-list/demon-list?authuser=0" target="_blank">
                <img src="dl_buttom.png" alt="Demon List" class="gd-btn">
            </a>
            <a href="https://discord.gg/F4GMNuwmb" target="_blank">
                <img src="discord_buttom.png" alt="Discord Oficial" class="gd-btn">
            </a>
            <a href="https://youtube.com/@senkogdps?si=U9_o5dM0em22q4b0" target="_blank">
                <img src="youtube_buttom.png" alt="YouTube" class="gd-btn">
            </a>
            <a href="https://www.tiktok.com/@imsenkogd" target="_blank">
                <img src="tiktok_buttom.png" alt="TikTok" class="gd-btn">
            </a>
        </div>
        
        <div class="cajas-dobles-madera">
            <div class="caja-madera">
                <h3>Discord </h3>
                <p><span class="indicador-online"></span><span id="discord-online">Cargando...</span></p>
                <p>👥 <span id="discord-total">70 Miembros</span></p>
            </div>

            <div class="caja-madera">
                <h3>Destacado </h3>
                <p>🎮 <span id="nivel-nombre">Level Name</span></p>
                <p><span id="nivel-creador">👤 Por: Creador</span></p>
            </div>
        </div>

    </div>

    <script src="destacado.js"></script>
    <script>
        const DISCORD_GUILD_ID = "1542250869028814878";

        async function obtenerDiscordLive() {
            try {
                const res = await fetch(`https://discord.com/api/guilds/${DISCORD_GUILD_ID}/widget.json`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("discord-online").textContent = `${data.presence_count} En Línea`;
                } else {
                    document.getElementById("discord-online").textContent = "10 En Línea";
                }
            } catch (e) {
                document.getElementById("discord-online").textContent = "10 En Línea";
            }
        }

        function obtenerNivelLive() {
            if (typeof nivelSemanal !== 'undefined') {
                document.getElementById("nivel-nombre").textContent = nivelSemanal.nombre;
                document.getElementById("nivel-creador").textContent = `👤 Por: ${nivelSemanal.creador}`;
            }
        }

        obtenerDiscordLive();
        obtenerNivelLive();
    </script>
</body>
</html>
